# ============================================================
#  engagement.yml — public, civic, schools and policy
#  engagement entries. Reverse-chronological list rendered on
#  the Engagement page below the headline narrative.
#
#  Schema per entry:
#    id:           short slug (used as <details> anchor)
#    year:         "2022–24" or "2024" (display string)
#    iso:          "2024" (sort key — string, descending)
#    category:     "Leadership" | "Activity" | "Press / media"
#                  | "Public lecture" | "Policy / advisory"
#    title:        short headline
#    summary:      one-line teaser shown on the closed card
#    body:         (optional) markdown-friendly long body inside <details>
#    image:        (optional) /path to an image; appears alongside body
#    image_alt:    (optional) alt for image
#    link:         (optional) { url, label } external link
#    links:        (optional) [{url,label}, ...] multiple external links
# ============================================================
entries:

  - id: atlas-eo-coordinator
    year: "2022–2024"
    iso: "2024"
    category: "Leadership"
    title: "ATLAS Collaboration Education and Outreach Coordinator"
    summary: "Elected coordinator (on the votes of 181 institutes) leading all educational and outreach activity of the ATLAS Collaboration at CERN."
    body: >-
      Elected position, on the votes of 181 institutes internationally that
      collaborate on the ATLAS experiment.  Strategic oversight and
      management of all educational and outreach initiatives from the
      international project; promotion of research outputs and the
      diversity of the collaboration.  Managed a core team of approximately
      twenty people.  The role hosts more than 55,000 visitors per year to
      the ATLAS Visitor Centre and reaches millions of engagements on
      social media and web platforms — co-ordinating content under
      atlas.cern and the social media channels, production of educational
      materials and events, and the flagship Open Data initiative.
    links:
      - { url: "https://atlas.cern",           label: "atlas.cern" }
      - { url: "https://opendata.atlas.cern",  label: "Open Data" }

  - id: ippog-uk-rep
    year: "2017–2024"
    iso: "2024-1"
    category: "Leadership"
    title: "UK representative, International Particle Physics Outreach Group"
    summary: "Appointed UK representative to the IPPOG Collaboration Board — coordinating and representing UK public engagement activities internationally."
    body: >-
      Appointed role (via the Institute of Physics) representing and
      coordinating UK public engagement activities within the IPPOG
      Collaboration — an international board of physicists, educators and
      public engagement professionals.  Particular focus on the
      development of a web database and public engagement resources for
      schoolchildren (presentations, activities, booklets) for re-use
      worldwide, and initiatives to widen participation in countries with
      limited opportunities for advanced science and computing teaching.
    link: { url: "https://ippog.org/", label: "ippog.org" }

