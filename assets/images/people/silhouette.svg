<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <!-- Single, easily-swappable team-photo placeholder.
       Warm paper background; oxblood-tinted figure.
       Replace this file with any 1:1 image to swap site-wide. -->
  <rect width="100" height="100" fill="#ebe5d8"/>
  <g fill="#8c3a2b" opacity="0.32">
    <!-- head -->
    <circle cx="50" cy="38" r="17"/>
    <!-- shoulders / torso (rounded arch) -->
    <path d="M 16 102
             Q 16 70 50 64
             Q 84 70 84 102 Z"/>
  </g>
</svg>
