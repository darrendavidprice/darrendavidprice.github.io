short: >-
  Darren Price is Professor of Particle Physics and Associate Dean for
  Engagement at the University of Manchester. His work spans dark matter
  searches, collider physics, quantum sensing and AI-enabled scientific
  discovery, with leadership roles across international experiments, research
  strategy and public engagement.

medium: >-
  Darren Price is Professor of Particle Physics and Associate Dean for
  Engagement at the University of Manchester. His research spans dark matter
  searches at the Large Hadron Collider and in deep-underground detectors,
  collider physics, rare-event detection, quantum sensing and AI-enabled
  scientific discovery. He established Manchester's direct dark matter detection
  programme and is developing new levitated-sensor approaches to probing dark
  matter, fifth forces and high-frequency gravitational waves. He also
  contributes to national research funding and strategy, university leadership,
  public engagement and interdisciplinary programme development.

long: >-
  Darren Price is Professor of Particle Physics and Associate Dean for
  Engagement at the University of Manchester. He is an experimental particle
  physicist whose work spans dark matter searches, collider physics, rare-event
  detection, quantum sensing, artificial intelligence and data-intensive
  scientific discovery.


  Over the past two decades he has worked within the ATLAS experiment at CERN,
  the DØ experiment at Fermilab and the DarkSide dark matter programme at Gran
  Sasso, holding research and leadership roles in international collaborations
  involving hundreds to thousands of researchers. His work has led teams in the
  discovery of new particles, the development of novel analysis methods, and the
  design of future dark matter and rare-event detection programmes.


  He established Manchester's involvement in the DarkSide programme and leads UK
  activities connected with DarkSide-20k, low-threshold argon detectors and
  future dark matter facilities. More recently, he has been developing new
  approaches based on levitated optomechanical sensors and quantum technologies
  to search for dark matter, fifth forces and high-frequency gravitational
  waves. As a former Alan Turing Fellow and Director of the STFC Centre for
  Doctoral Training in Data Intensive Science, he has also led programmes
  connecting physics, AI, engineering, industry and large-scale scientific data
  analysis.


  Alongside research, he leads public, civic and schools engagement across
  Manchester's Faculty of Science and Engineering and contributes to national
  research strategy through UKRI-STFC, Royal Society and international advisory
  roles.
