  - id: schools-masterclass
    year: "2014–"
    iso: "2014-3"
    category: "Activity"
    title: "Organiser, annual Manchester Schools Particle Physics Masterclass"
    summary: "Full-day event of lectures, Q&A, and hands-on analysis of LHC data — reaching thousands of A-Level students each year."
    body: >-
      Coordinate an annual full-day event that incorporates lectures,
      Q&A sessions and hands-on activities including experience with
      analysis of data from the Large Hadron Collider.  The masterclass
      relies on the involvement of around twenty-five staff and PGR
      students from the Particle Physics Group every year, currently
      reaching thousands of A-Level students.  Expanding to a twice-a-year
      activity targeting Widening Participation audiences, in partnership
      with the UoM Widening Participation Team.

